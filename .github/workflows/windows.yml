name: Build Nova Player Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Test/**'
      - 'README.md'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Test and Package Nova Player
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore native playback dependencies
        run: dotnet restore Test/src/NovaPlayer/NovaPlayer.csproj --runtime win-x64

      - name: Build self-contained Nova Player
        run: dotnet publish Test/src/NovaPlayer/NovaPlayer.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=false -o Test/publish

      - name: Verify executable and playback engine
        shell: pwsh
        run: |
          if (!(Test-Path 'Test/publish/NovaPlayer.exe')) { throw 'NovaPlayer.exe was not generated' }
          $native = @(Get-ChildItem 'Test/publish' -Filter libvlc.dll -Recurse -File)
          if ($native.Count -eq 0) { throw 'LibVLC engine is missing from the Windows build' }

      - name: Test native VLC engine startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--diagnose' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($test.ExitCode -ne 0) { throw "Native VLC startup test failed: $($test.ExitCode)" }

      - name: Test actual WPF window startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($test.ExitCode -ne 0) { throw "Nova UI failed to start: $($test.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup missing' }

      - name: Compile Nova Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Test\installer\NovaPlayer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path 'Test/dist/Nova-Player-Setup-1.2.1.exe')) { throw 'Nova Setup.exe missing' }

      - name: Preserve previous player updater compatibility
        shell: pwsh
        run: |
          # Previous Luma Player v1.1 checks for this exact legacy filename.
          # Both assets contain the same Nova Player v1.2 installer.
          Copy-Item 'Test/dist/Nova-Player-Setup-1.2.1.exe' 'Test/dist/Luma-Player-Setup-1.2.1.exe'

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Player-Windows-Setup-1.2.1
          path: Test/dist/Nova-Player-Setup-1.2.1.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Nova Player preview release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-nova]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-preview
          name: 'Nova Player v1.2.1 — Responsive Playback & Minimal UI (Preview)'
          prerelease: true
          make_latest: false
          body: |
            Nova Player v1.2.1 moves VLC initialization and media opening off the UI thread, throttles playback polling, bounds thumbnail loading and coalesces settings writes. This remains a single self-contained Windows installer with complete VLC engine support.
            Nova Player is the new brand for Luma Player. Simplified Home, Music,
            Videos, Settings, Updates and About navigation. Video playback enters
            immersive fullscreen by default; turn this off in Settings.
            Less expensive UI effects and deferred VLC initialization speed up
            initial window presentation. Library settings from Luma Player are
            imported once without deleting the original.

            Nova-Player-Setup-1.2.1.exe is the new installer.
            Luma-Player-Setup-1.2.1.exe is an identical compatibility copy for
            users updating through the previous Luma Player v1.1 updater.

            GitHub CI validates compilation, VLC startup, and WPF window startup.
            This is an unsigned preview; it has NOT been fully tested on physical
            Windows hardware for every codec or upgrade path. Do not disable antivirus.
            The GitHub repository URL remains /Luma-Player for compatibility.
          files: |
            Test/dist/Nova-Player-Setup-1.2.1.exe
            Test/dist/Luma-Player-Setup-1.2.1.exe
