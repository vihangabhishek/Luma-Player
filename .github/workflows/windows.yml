name: Build Nova Player Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Test/**'
      - 'README.md'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Test and Package Nova Player
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore native playback dependencies
        run: dotnet restore Test/src/NovaPlayer/NovaPlayer.csproj --runtime win-x64

      - name: Build self-contained Nova Player
        run: dotnet publish Test/src/NovaPlayer/NovaPlayer.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=false -o Test/publish

      - name: Verify executable and playback engine
        shell: pwsh
        run: |
          if (!(Test-Path 'Test/publish/NovaPlayer.exe')) { throw 'NovaPlayer.exe was not generated' }
          $native = @(Get-ChildItem 'Test/publish' -Filter libvlc.dll -Recurse -File)
          if ($native.Count -eq 0) { throw 'LibVLC engine is missing from the Windows build' }

      - name: Test native VLC engine startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--diagnose' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($test.ExitCode -ne 0) { throw "Native VLC startup test failed: $($test.ExitCode)" }

      - name: Test actual audio playback through LibVLC
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--playback-smoke-test' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($test.ExitCode -ne 0) { throw "Native audio playback smoke test failed: $($test.ExitCode)" }

      - name: Test REAL native Windows video playback
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--video-smoke-test' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 50 }
          if ($test.ExitCode -ne 0) { throw "Real native video renderer test failed: $($test.ExitCode)" }

      - name: Test actual WPF window startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Test/publish/NovaPlayer.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($test.ExitCode -ne 0) { throw "Nova UI failed to start: $($test.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup missing' }

      - name: Compile Nova Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Test\installer\NovaPlayer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path 'Test/dist/Nova-Player-Setup-1.4.0.exe')) { throw 'Nova Setup.exe missing' }

      - name: Preserve previous player updater compatibility
        shell: pwsh
        run: |
          # Previous Luma Player v1.1 checks for this exact legacy filename.
          # Both assets contain the same Nova Player v1.2 installer.
          Copy-Item 'Test/dist/Nova-Player-Setup-1.4.0.exe' 'Test/dist/Luma-Player-Setup-1.4.0.exe'

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Player-Windows-Setup-1.4.0
          path: Test/dist/Nova-Player-Setup-1.4.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Nova Player preview release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-nova]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-preview
          name: 'Nova Player v1.4.0 — Native Video Playback Fix & Classic UI (Test Release)'
          prerelease: true
          make_latest: false
          body: |
            Nova Player v1.4 moves the video renderer to a direct WinForms native HWND
            host, addressing black video and audio-only playback issues seen with the
            previous WPF video surface. The media player now attaches to its actual,
            visible Windows HWND before trying to play videos.
            The user interface has been simplified toward a classic desktop media
            player: native-style media menu, file/folder buttons, uncluttered main
            video area and playback controls below it.
            Home, Music, Videos, Settings, Updates and About remain available.
            Windows CI checks compilation, native LibVLC startup, actual WAV audio
            playback, WPF navigation and REAL video playback on the attached Windows
            HWND using an auto-generated uncompressed AVI fixture.
            This release still needs physical Windows/GPU/movie-format testing.
            It is an unsigned technical preview, not a guarantee that all codecs,
            subtitles and PC configurations work. Do not disable antivirus.
            The repository URL remains Luma-Player for old updater compatibility.
          files: |
            Test/dist/Nova-Player-Setup-1.4.0.exe
            Test/dist/Luma-Player-Setup-1.4.0.exe
