name: Build Luma Player Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Test/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WPF and LibVLC dependencies
        run: dotnet restore Test/src/LumaPlayer/LumaPlayer.csproj --runtime win-x64

      - name: Build self-contained Windows player
        run: dotnet publish Test/src/LumaPlayer/LumaPlayer.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=false -o Test/publish

      - name: Verify app and VLC native engine
        shell: pwsh
        run: |
          if (!(Test-Path 'Test/publish/LumaPlayer.exe')) { throw 'LumaPlayer.exe was not generated' }
          $native = @(Get-ChildItem 'Test/publish' -Filter libvlc.dll -Recurse -File)
          if ($native.Count -eq 0) { throw 'LibVLC engine missing from the published player' }

      - name: Run real LibVLC startup smoke test
        shell: pwsh
        run: |
          $player = (Resolve-Path 'Test/publish/LumaPlayer.exe').Path
          $process = Start-Process -FilePath $player -ArgumentList '--diagnose' -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'LumaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 70 }
          if ($process.ExitCode -ne 0) { throw "LibVLC startup failed with exit code $($process.ExitCode)" }

      - name: Launch WPF app home screen (Windows smoke test)
        shell: pwsh
        run: |
          $player = (Resolve-Path 'Test/publish/LumaPlayer.exe').Path
          $process = Start-Process -FilePath $player -ArgumentList '--ui-smoke-test' -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'LumaPlayer/logs/startup.log'
          if (Test-Path $log) { Get-Content $log -Tail 35 }
          if ($process.ExitCode -ne 0) { throw "Windows WPF home screen failed startup, exit $($process.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup was not installed' }

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Test\installer\LumaPlayer.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Player-Windows-Setup
          path: Test/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish test release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-1.1]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-preview
          name: 'Luma Player v1.1.0 — Home Video Previews & In-App Updates (Test Release)'
          prerelease: true
          make_latest: false
          body: |
            Luma Player v1.1 adds offline Home video discovery and Explorer-based video preview cards, plus manual in-app update checking and SHA-256 verified downloads from GitHub Releases.
            Scans the current user's Videos folder and top-level Downloads, and shows any imported library videos. Other folders can be added manually.
            Installers remain unsigned preview builds: Windows SmartScreen may warn. Do not disable antivirus.
            Windows CI checks include native VLC startup and WPF home screen smoke test, but physical PC testing is still recommended.
            This is an unsigned technical preview. The installer has not been tested end-to-end on a physical Windows 11 PC.
            Windows lock-screen media controls are not implemented yet.
            Performance and hardware acceleration depend on the GPU, codec, video, and drivers.
            Do not disable Microsoft Defender for installation; report any suspicious detections.
          files: Test/dist/*.exe
